<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>電力市場 情報ポータル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--brand:#0B4F8A;--brand-2:#1E88E5;--accent:#E8622C;--ink:#1A2733;--ink-soft:#5B6B78;--line:#E3E9EF;--bg:#F4F7FA;--card:#FFFFFF;--shadow:0 1px 3px rgba(16,42,67,.08),0 4px 16px rgba(16,42,67,.06);}
  *{box-sizing:border-box;}
  body{font-family:"Noto Sans JP","Yu Gothic","Meiryo",sans-serif;color:var(--ink);background:var(--bg);margin:0;line-height:1.7;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1040px;margin:0 auto;padding:40px 24px 64px;}
  .hero{background:linear-gradient(120deg,var(--brand) 0%,var(--brand-2) 100%);color:#fff;border-radius:18px;padding:48px 40px;box-shadow:var(--shadow);text-align:center;}
  .hero .eyebrow{font-size:12px;letter-spacing:.2em;opacity:.85;font-weight:500;text-transform:uppercase;}
  .hero h1{font-size:34px;font-weight:700;margin:10px 0 8px;letter-spacing:.02em;}
  .hero p{font-size:14.5px;opacity:.92;margin:0 auto;max-width:680px;}
  .section-label{margin:30px 2px 14px;font-size:14px;font-weight:700;color:var(--brand);}
  .themes{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  a.theme{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 28px;box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s;}
  a.theme:hover{transform:translateY(-3px);box-shadow:0 8px 26px rgba(16,42,67,.16);border-color:#C9D8E8;}
  .theme h2{font-size:21px;font-weight:700;margin:0 0 6px;color:var(--ink);border:0;padding:0;}
  .theme .desc{font-size:13px;color:var(--ink-soft);min-height:38px;}
  .theme .counts{font-size:12px;color:var(--ink-soft);margin-top:10px;}
  .theme .latest{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;}
  .theme .latest .l-label{font-size:11px;color:var(--ink-soft);}
  .theme .latest .l-main{font-weight:700;}
  .go{margin-top:12px;font-size:13px;color:var(--brand-2);font-weight:700;}
  .empty{color:var(--ink-soft);padding:40px;text-align:center;}
  .foot{margin-top:40px;font-size:11.5px;color:var(--ink-soft);text-align:center;}
  @media(max-width:720px){.themes{grid-template-columns:1fr;}.hero h1{font-size:26px;}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="eyebrow">POWER MARKET DATA PORTAL</div>
    <h1>電力市場 情報ポータル</h1>
    <p>日本の電力市場データを、テーマ別に自動分析して公開しています。各テーマから週次・日次のレポートをご覧いただけます。</p>
  </header>

  <div class="section-label">公開テーマ</div>
  
  <div class="themes">
    
    <a class="theme" href="jepx-spot/index.html">
      <h2>JEPXスポット市場</h2>
      <div class="desc">JEPX一日前市場（スポット）の価格・約定量の週次／日次分析。気温・発電設備停止の要因も反映。</div>
      <div class="counts">
        週次 26 件
         ／ 
        日次 175 件
      </div>
      
      <div class="latest">
        <div class="l-label">最新トピック</div>
        <div class="l-main">東京で高値</div>
      </div>
      
      <div class="go">このテーマを見る →</div>
    </a>
    
  </div>
  

  <div class="foot">Generated by jepx_weekly v0.1.0　|　データ出典: JEPX、気象庁、HJKS ほか</div>
</div>
</body>
</html>
